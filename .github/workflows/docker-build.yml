name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - docker-compose.yml
      - upstream-refs.json
      - .github/workflows/docker-build.yml
  workflow_dispatch: {}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read upstream refs
        id: refs
        run: |
          echo "adventureland=$(jq -r .adventureland_mongodb upstream-refs.json)" >> "$GITHUB_OUTPUT"
          echo "common=$(jq -r .common_engine upstream-refs.json)" >> "$GITHUB_OUTPUT"
          echo "secretsandconfig=$(jq -r .adventureland_secretsandconfig upstream-refs.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ADVENTURELAND_REF=${{ steps.refs.outputs.adventureland }}
            COMMON_ENGINE_REF=${{ steps.refs.outputs.common }}
            SECRETSANDCONFIG_REF=${{ steps.refs.outputs.secretsandconfig }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.refs.outputs.adventureland }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
