name: Check Upstream for Updates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest upstream commits
        id: latest
        run: |
          get_sha() { git ls-remote "https://github.com/kaansoral/$1.git" HEAD | cut -f1; }
          echo "adventureland=$(get_sha adventureland_mongodb)" >> "$GITHUB_OUTPUT"
          echo "common=$(get_sha common_engine)" >> "$GITHUB_OUTPUT"
          echo "secretsandconfig=$(get_sha adventureland_secretsandconfig)" >> "$GITHUB_OUTPUT"

      - name: Update upstream-refs.json if changed
        id: update
        run: |
          jq -n \
            --arg a "${{ steps.latest.outputs.adventureland }}" \
            --arg c "${{ steps.latest.outputs.common }}" \
            --arg s "${{ steps.latest.outputs.secretsandconfig }}" \
            '{adventureland_mongodb:$a, common_engine:$c, adventureland_secretsandconfig:$s}' \
            > upstream-refs.new.json

          if diff -q upstream-refs.json upstream-refs.new.json > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv upstream-refs.new.json upstream-refs.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f upstream-refs.new.json

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upstream-refs.json
          git commit -m "chore: bump upstream refs (automated)"
          git push
