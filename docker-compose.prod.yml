## Standalone production compose file — Traefik-fronted, pulls the image
## GitHub Actions already built (no build tools needed on the host).
## Copy this file alone to your server; it doesn't depend on docker-compose.yml.
##
## Rename the "al" / "al-ws" subdomain labels below to whatever you want —
## they just need to match two real DNS records pointed at this host.
##
## Requires a .env next to this file with at least:
##   DOMAINNAME=example.com
## All persistent state (Mongo data + the editable secretsandconfig files)
## lives under $DATA_DIR on the host, default shown below:
##   DATA_DIR=/home/docker/adventureland
##
## Usage:
##   docker compose -f docker-compose.prod.yml pull
##   docker compose -f docker-compose.prod.yml up -d

services:
  # A single-node replica set, not a plain standalone instance: the app uses
  # multi-document transactions (tx_get/tx_save in common_engine), which
  # MongoDB only allows on a replica set or mongos ("Transaction numbers are
  # only allowed on a replica set member or mongos" otherwise).
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      internal:
    volumes:
      - ${DATA_DIR:-/home/docker/adventureland}/mongo:/data/db

  # One-shot: initializes the replica set on first run, no-ops on every run
  # after (checked via rs.status()). Exits once done; app waits on that.
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      internal:
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - |
        try { rs.status(); print("replica set already initialized"); }
        catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); print("replica set initiated"); }

  app:
    image: ${GHCR_IMAGE:-ghcr.io/jmartell72/adventureland-mongodb-docker:latest}
    container_name: al_app
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      t2_proxy:
      internal:
    volumes:
      # Editable config/secrets (Stripe, Discord, Steam keys, ACCESS_MASTER,
      # etc.) — seeded from the image on first boot, then persists across
      # restarts and rebuilds. See scripts/entrypoint.sh and patch-config.js.
      - ${DATA_DIR:-/home/docker/adventureland}/secretsandconfig:/app/secretsandconfig
    environment:
      MONGODB_URI: mongodb://mongo:27017/adventureland?replicaSet=rs0
      GAME_SERVER_KEY: local
      BASE_URL: https://al.${DOMAINNAME}
      GAME_SERVER_ADDRESS: al-ws.${DOMAINNAME}
      PUBLIC_SECURE: "true"
    labels:
      - "traefik.enable=true"
      ## --- Web backend (Express, port 8090) ---
      - "traefik.http.routers.al-web-rtr.entrypoints=https"
      - "traefik.http.routers.al-web-rtr.rule=Host(`al.${DOMAINNAME}`)"
      - "traefik.http.routers.al-web-rtr.tls=true"
      #- "traefik.http.routers.al-web-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.al-web-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.al-web-rtr.service=al-web-svc"
      - "traefik.http.services.al-web-svc.loadbalancer.server.port=8090"
      ## --- Game server (Socket.IO, port 7192) ---
      - "traefik.http.routers.al-ws-rtr.entrypoints=https"
      - "traefik.http.routers.al-ws-rtr.rule=Host(`al-ws.${DOMAINNAME}`)"
      - "traefik.http.routers.al-ws-rtr.tls=true"
      #- "traefik.http.routers.al-ws-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.al-ws-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.al-ws-rtr.service=al-ws-svc"
      - "traefik.http.services.al-ws-svc.loadbalancer.server.port=7192"

networks:
  t2_proxy:
    external: true
  internal:
    internal: true
